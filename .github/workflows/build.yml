name: Build OptiHud

on:
  push:
    branches: [ main, freebuff/1b6ade1de2eef2676ce428d2 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.1
          wrapper: true

      - name: Build with Gradle
        run: ./gradlew build
        shell: bash
        env:
          org.gradle.jvmargs: -Xmx4g

      - name: Upload build artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: OptiHud-1.0.0.jar
          path: build/libs/OptiHud-1.0.0.jar
          retention-days: 30

      - name: Optimize JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp build/libs/OptiHud-1.0.0.jar OptiHud.jar
          echo "OptiHud.jar ready for mods folder"
